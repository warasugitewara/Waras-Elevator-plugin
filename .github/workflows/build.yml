name: Build

# PR・master への push でPaper版/NeoForge版をビルドしテストする。
# master への push 時、バージョン(v<version>)のリリースがまだ無ければ
# 両方の jar を添付した GitHub Release を自動で作成する。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release の作成に必要
    steps:
      - uses: actions/checkout@v7

      # Paper 版は Java 25、NeoForge 版は Java 21 のツールチェーンを使う(最後に書いた 25 が既定)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check versions
        id: version
        run: |
          paper=$(sed -nE 's/^version = "(.+)"$/\1/p' build.gradle.kts)
          neoforge=$(sed -nE 's/^mod_version=(.+)$/\1/p' neoforge/gradle.properties)
          echo "Paper: ${paper} / NeoForge: ${neoforge}"
          if [ -z "${paper}" ] || [ "${paper}" != "${neoforge}" ]; then
            echo "::error::build.gradle.kts の version と neoforge/gradle.properties の mod_version を揃えてください"
            exit 1
          fi
          echo "version=${paper}" >> "$GITHUB_OUTPUT"

      - name: Build Paper
        run: ./gradlew build

      - name: Build NeoForge
        # setup-java で入れた JDK 21 をツールチェーンとして使わせる
        run: ./gradlew -p neoforge build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Check whether release is needed
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "${TAG} は既にリリース済みのためスキップします"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "${notes}" ]; then
            echo "::error::${notes} がありません。リリースノートを追加してください"
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.release.outputs.needed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Wara's Elevators v${{ steps.version.outputs.version }}
          body_path: .github/release-notes/v${{ steps.version.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            build/libs/WarasElevators-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/WarasElevators-NeoForge-1.21.1-${{ steps.version.outputs.version }}.jar
