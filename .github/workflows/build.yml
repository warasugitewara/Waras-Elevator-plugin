name: Build

# PR・master への push でPaper版/NeoForge版をビルドしテストする。
# master への push 時は v<version> の GitHub Release を自動で更新する。
#   - リリースが無ければ、両方の jar を添付して新規作成する
#   - 既にあれば、まだ添付されていない jar だけを追加し、リリースノートを本文末尾に追記する
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release の作成・更新に必要
    steps:
      - uses: actions/checkout@v7

      # Paper 版は Java 25、NeoForge 版は Java 21 のツールチェーンを使う(最後に書いた 25 が既定)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check versions
        id: version
        run: |
          paper=$(sed -nE 's/^version = "(.+)"$/\1/p' build.gradle.kts)
          neoforge=$(sed -nE 's/^mod_version=(.+)$/\1/p' neoforge/gradle.properties)
          echo "Paper: ${paper} / NeoForge: ${neoforge}"
          if [ -z "${paper}" ] || [ "${paper}" != "${neoforge}" ]; then
            echo "::error::build.gradle.kts の version と neoforge/gradle.properties の mod_version を揃えてください"
            exit 1
          fi
          echo "version=${paper}" >> "$GITHUB_OUTPUT"

      - name: Build Paper
        run: ./gradlew build

      - name: Build NeoForge
        # setup-java で入れた JDK 21 をツールチェーンとして使わせる
        run: ./gradlew -p neoforge build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          mc=$(sed -nE 's/^minecraft_version=(.+)$/\1/p' neoforge/gradle.properties)
          notes=".github/release-notes/${tag}.md"
          files=(
            "build/libs/WarasElevators-${VERSION}.jar"
            "neoforge/build/libs/WarasElevators-${VERSION}-neoforge-${mc}.jar"
          )
          for f in "${files[@]}"; do
            [ -f "${f}" ] || { echo "::error::${f} がビルドされていません"; exit 1; }
          done

          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            # リリースが無ければ新規作成
            [ -f "${notes}" ] || { echo "::error::${notes} がありません。リリースノートを追加してください"; exit 1; }
            gh release create "${tag}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --title "Wara's Elevators ${tag}" --notes-file "${notes}"
            exit 0
          fi

          # 既存リリースには、まだ添付されていない jar だけを追加する(既存の jar は置き換えない)
          existing=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          missing=()
          for f in "${files[@]}"; do
            grep -qxF "$(basename "${f}")" <<< "${existing}" || missing+=("${f}")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "${tag} には全ての jar が添付済みのためスキップします"
            exit 0
          fi
          gh release upload "${tag}" "${missing[@]}" --repo "${GITHUB_REPOSITORY}"

          # jar を追加したときだけ、リリースノートがあれば既存の本文の末尾に追記する
          if [ -f "${notes}" ]; then
            body=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')
            printf '%s\n\n%s\n' "${body}" "$(cat "${notes}")" > "${RUNNER_TEMP}/notes.md"
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
